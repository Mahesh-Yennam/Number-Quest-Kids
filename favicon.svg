<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="numBg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- 3D Block Gradients -->
    <linearGradient id="blockFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#numBg)" />

  <!-- Drop Shadow -->
  <ellipse cx="32" cy="52" rx="18" ry="5" fill="#022c22" fill-opacity="0.5" />

  <!-- 3D Toy Block Top Bevel -->
  <path d="M18 20 L32 12 L46 20 L32 26 Z" fill="url(#blockTop)" />

  <!-- 3D Toy Block Front Face -->
  <path d="M18 20 L32 26 L46 20 L46 44 L32 50 L18 44 Z" fill="url(#blockFront)" />

  <!-- Front Bevel Highlight -->
  <path d="M32 26 L32 50" stroke="#b45309" stroke-width="1.5" />

  <!-- Number '1' on Left -->
  <text x="25" y="39" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Number '2' on Right -->
  <text x="39" y="39" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#fef08a" text-anchor="middle">2</text>

  <!-- Sparkles -->
  <circle cx="15" cy="16" r="2.5" fill="#fde047" />
  <circle cx="50" cy="16" r="2" fill="#bae6fd" />
  <circle cx="51" cy="48" r="2.2" fill="#fde047" />
</svg>
